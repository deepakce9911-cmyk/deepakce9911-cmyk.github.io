<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;800&display=swap">
<style>
  /* Rendered at 1200x630, 1200x675, 1200x900 and 1200x1200 by src/og-image.mjs. */
  html, body { margin: 0; width: 100%; height: 100%; }
  body {
    background: radial-gradient(120% 90% at 85% 10%, #2a2214 0%, #0f0f10 55%);
    color: #f2f3f7;
    font-family: 'Host Grotesk', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 72px 80px;
    box-sizing: border-box;
  }
  .eyebrow { font: 500 24px/1 'Host Grotesk', sans-serif; letter-spacing: 4px; text-transform: uppercase; color: #c8933a; }
  h1 { font-size: 84px; font-weight: 800; line-height: 1.02; letter-spacing: -2px; margin: 0 0 28px; }
  h1 .vs { color: #c8933a; }
  p { font-size: 36px; font-weight: 700; line-height: 1.25; color: #bdb8ad; font-weight: 500; margin: 0; max-width: 960px; }
  .foot { display: flex; justify-content: space-between; align-items: flex-end; font: 500 22px/1 'Host Grotesk', sans-serif; letter-spacing: 1px; color: #9a958b; }
  .bar { display: flex; height: 10px; width: 260px; }
  .bar span { flex: 1; }
</style>
</head>
<body>
  <div class="eyebrow">Comparison · 2026</div>
  <div>
    <h1>Dextr <span class="vs">vs</span><br>Canary AI Voice</h1>
    <p>Which AI should answer your hotel's phone?</p>
  </div>
  <div class="foot">
    <span>Bookings · Deposits · Handoffs · Setup</span>
    <div class="bar"><span style="background:#c8933a"></span><span style="background:#f7f7f7"></span><span style="background:#a07a2c"></span></div>
  </div>
</body>
</html>
