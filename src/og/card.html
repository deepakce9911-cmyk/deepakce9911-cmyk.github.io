<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Sora:wght@700;800&display=swap">
<style>
  /* Rendered at 1200x630, 1200x675, 1200x900 and 1200x1200 by src/og-image.mjs. */
  html, body { margin: 0; width: 100%; height: 100%; }
  body {
    background: #141b34;
    color: #f2f3f7;
    font-family: 'Sora', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 72px 80px;
    box-sizing: border-box;
  }
  .eyebrow { font: 400 26px/1 'IBM Plex Mono', monospace; letter-spacing: 3px; text-transform: uppercase; color: #e0a35a; }
  h1 { font-size: 84px; font-weight: 800; line-height: 1.02; letter-spacing: -2px; margin: 0 0 28px; }
  h1 .vs { color: #e0a35a; }
  p { font-size: 36px; font-weight: 700; line-height: 1.25; color: #bfc4d6; margin: 0; max-width: 960px; }
  .foot { display: flex; justify-content: space-between; align-items: flex-end; font: 400 24px/1 'IBM Plex Mono', monospace; color: #a3a9bd; }
  .bar { display: flex; height: 10px; width: 260px; }
  .bar span { flex: 1; }
</style>
</head>
<body>
  <div class="eyebrow">Comparison · 2026</div>
  <div>
    <h1>Dextr <span class="vs">vs</span><br>Canary AI Voice</h1>
    <p>Which AI should answer your hotel's phone?</p>
  </div>
  <div class="foot">
    <span>Bookings · Deposits · Handoffs · Setup</span>
    <div class="bar"><span style="background:#e0a35a"></span><span style="background:#f2f3f7"></span><span style="background:#7a4c14"></span></div>
  </div>
</body>
</html>
